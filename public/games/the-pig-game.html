<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dice Roll Challenge 🎲</title>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: inherit;
}

html {
  font-size: 62.5%;
  box-sizing: border-box;
}

body {
  font-family: 'Nunito', sans-serif;
  font-weight: 400;
  height: 100vh;
  color: #333;
  background-image: linear-gradient(to top left, #753682 0%, #bf2e34 100%);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* LAYOUT */
main {
  position: relative;
  width: 100rem;
  height: 60rem;
  background-color: rgba(255, 255, 255, 0.35);
  backdrop-filter: blur(200px);
  filter: blur();
  box-shadow: 0 3rem 5rem rgba(0, 0, 0, 0.25);
  border-radius: 9px;
  overflow: hidden;
  display: flex;
}

.player {
  flex: 50%;
  padding: 9rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: all 0.75s;
}

/* ELEMENTS */
.name {
  position: relative;
  font-size: 4rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  word-spacing: 2px;
  font-weight: 300;
  margin-bottom: 1rem;
}

.score {
  font-size: 6rem;
  font-weight: 300;
  color: #c7365f;
  margin-bottom: auto;
}

.player--active {
  background-color: rgba(255, 255, 255, 0.4);
}
.player--active .name {
  font-weight: 700;
}
.player--active .score {
  font-weight: 400;
}

.player--active .current {
  opacity: 1;
}

.current {
  background-color: #c7365f;
  opacity: 0.8;
  border-radius: 9px;
  color: #fff;
  width: 65%;
  padding: 2rem;
  text-align: center;
  transition: all 0.75s;
}

.current-label {
  text-transform: uppercase;
  margin-bottom: 1rem;
  font-size: 1.7rem;
  color: #ddd;
}

.current-score {
  font-size: 3.5rem;
}

/* ABSOLUTE POSITIONED ELEMENTS */
.btn {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  color: #444;
  background: none;
  border: none;
  font-family: inherit;
  font-size: 1.8rem;
  text-transform: uppercase;
  cursor: pointer;
  font-weight: 400;
  transition: all 0.2s;

  background-color: white;
  background-color: rgba(255, 255, 255, 0.6);
  backdrop-filter: blur(10px);

  padding: 0.7rem 2.5rem;
  border-radius: 50rem;
  box-shadow: 0 1.75rem 3.5rem rgba(0, 0, 0, 0.1);
}

.btn::first-letter {
  font-size: 2.4rem;
  display: inline-block;
  margin-right: 0.7rem;
}

.btn--new {
  top: 4rem;
}
.btn--roll {
  top: 39.3rem;
}
.btn--hold {
  top: 46.1rem;
}

.btn:active {
  transform: translate(-50%, 3px);
  box-shadow: 0 1rem 2rem rgba(0, 0, 0, 0.15);
}

.btn:focus {
  outline: none;
}

.dice {
  position: absolute;
  left: 50%;
  top: 16.5rem;
  transform: translateX(-50%);
  height: 10rem;
  box-shadow: 0 2rem 5rem rgba(0, 0, 0, 0.2);
}

.player--winner {
  background-color: #2f2f2f;
}

.player--winner .name {
  font-weight: 700;
  color: #c7365f;
}

.hidden {
  display: none;
}
    </style>
</head>
<body>
<main>
        <section class="player player--0 player--active">
            <h2 class="name" id="name--0">Player 1</h2>
            <p class="score" id="score--0">43</p>
            <div class="current">
                <p class="current-label">Current</p>
                <p class="current-score" id="current--0">0</p>
            </div>
        </section>
        <section class="player player--1">
            <h2 class="name" id="name--1">Player 2</h2>
            <p class="score" id="score--1">24</p>
            <div class="current">
                <p class="current-label">Current</p>
                <p class="current-score" id="current--1">0</p>
            </div>
        </section>

        <img decoding="async" src="/images/posts/the-pig-game/dice-5.png" alt="Playing dice" class="dice hidden">

        <button class="btn btn--new">🔄 New game</button>
        <button class="btn btn--roll">🎲 Roll dice</button>
        <button class="btn btn--hold">📥 Hold</button>
    </main>

    <script>
        'use strict';

        const score0El = document.querySelector('#score--0');
        const score1El = document.getElementById('score--1');
        const current0El = document.getElementById('current--0');
        const current1El = document.getElementById('current--1');
        const diceEl = document.querySelector('.dice');
        const btnNew = document.querySelector('.btn--new');
        const btnRoll = document.querySelector('.btn--roll');
        const btnHold = document.querySelector('.btn--hold');
        const player0El = document.querySelector('.player--0');
        const player1El = document.querySelector('.player--1');
        let scores, currentScore, activePlayer, playing;

        const init = function () {
            scores = [0, 0];
            currentScore = 0;
            activePlayer = 0;
            playing = true;

            current0El.textContent = 0;
            current1El.textContent = 0;
            score0El.textContent = 0;
            score1El.textContent = 0;

            diceEl.classList.add('hidden');
            btnHold.classList.remove('hidden');
            btnRoll.classList.remove('hidden');

            player0El.classList.remove('player--winner');
            player1El.classList.remove('player--winner');
            player0El.classList.add('player--active');
            player1El.classList.remove('player--active');
        };

        init();

        const switchPlayer = function () {
            document.getElementById(`current--${activePlayer}`).textContent = 0;
            document.querySelector(`.player--${activePlayer}`).classList.remove('player--active');
            activePlayer = activePlayer === 0 ? 1 : 0;
            document.querySelector(`.player--${activePlayer}`).classList.add('player--active');
            currentScore = 0;
        };

        btnRoll.addEventListener('click', function () {
            if (playing) {
                const dice = Math.trunc(Math.random() * 6) + 1;
                diceEl.classList.remove('hidden');
                diceEl.src = `https://kclearncode.com/wp-content/uploads/2025/02/dice-${dice}.png`;

                if (dice !== 1) {
                    currentScore += dice;
                    document.getElementById(`current--${activePlayer}`).textContent = currentScore;
                } else {
                    switchPlayer();
                }
            }
        });

        btnHold.addEventListener('click', function () {
            if (playing) {
                scores[activePlayer] += currentScore;
                document.getElementById(`score--${activePlayer}`).textContent = scores[activePlayer];

                if (scores[activePlayer] >= 100) {
                    playing = false;
                    document.querySelector(`.player--${activePlayer}`).classList.add('player--winner');
                    document.querySelector(`.player--${activePlayer}`).classList.remove('player--active');
                    diceEl.classList.add('hidden');
                    btnHold.classList.add('hidden');
                    btnRoll.classList.add('hidden');
                } else {
                    switchPlayer();
                }
            }
        });

        btnNew.addEventListener('click', function () {
            init();
        });
    </script>
<script>
  // Báo chiều cao thật ra trang cha để iframe không bị cắt hay thừa chỗ trống.
  const kcReportHeight = () => {
    const h = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
    parent.postMessage({ kcGameHeight: h }, '*');
  };
  addEventListener('load', kcReportHeight);
  addEventListener('click', () => requestAnimationFrame(kcReportHeight));
  // ResizeObserver bọc trong try: nếu môi trường không có nó, throw ở đây sẽ làm
  // chết cả phần script còn lại và mất luôn cơ chế báo chiều cao.
  try {
    new ResizeObserver(kcReportHeight).observe(document.body);
  } catch {}
</script>
</body>
</html>
